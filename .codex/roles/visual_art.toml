房间交同机位修复前后的成画。窗棂能遮光，窗花、地板和经过的家具接到同一方向的光。保持固定家具支点和透视。与动画一起定转头和接触帧。回报所用参考、已画和仍缺的层、原尺寸对照与待解决的问题。按任务约定交付美术源件，程序导入由集成者负责。
